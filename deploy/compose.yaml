services:
  hub:
    image: ${NETHACKERS_HUB_IMAGE:?set NETHACKERS_HUB_IMAGE}
    restart: unless-stopped
    command: ["nethackers-hub", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      NETHACKERS_DB: /data/hub.sqlite3
      NETHACKERS_CLIENT_ID: ${NETHACKERS_CLIENT_ID:?set NETHACKERS_CLIENT_ID}
    expose: ["8000"]
    volumes:
      - /srv/nethackers/data:/data
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    init: true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on: {hub: {condition: service_healthy}}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - /srv/nethackers/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    init: true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
networks: {private: {}}
volumes: {caddy_data: {}, caddy_config: {}}
