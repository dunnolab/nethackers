[project]
name = "nethackers"
version = "0.0.0"
description = "Solve NetHack by evolving symbolic players — evaluation and registration core."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
nle = ["nle==1.3.0"]
autoascend = ["numba>=0.60", "opencv-python>=4.9", "scipy>=1.11", "nltk>=3.9", "toolz>=1.0"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12"]

[project.scripts]
nethackers = "nethackers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nethackers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "nle: requires the optional NLE dependency and a real NetHack environment",
  "docker: requires Docker and the built arena image",
]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
