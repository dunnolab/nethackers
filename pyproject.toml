[project]
name = "nethackers"
version = "0.8.0"
description = "Solve NetHack by evolving symbolic players — evaluation and registration core."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "NetHackers contributors" }]
keywords = ["agents", "evolution", "nethack", "autoascend", "coding-agents"]
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "rich-argparse>=1.5",
    "textual>=0.60",
]

[project.urls]
Homepage = "https://nethackers.dunnolab.ai"
Repository = "https://github.com/dunnolab/nethackers"

[project.optional-dependencies]
nle = ["nle==1.3.0"]
autoascend = ["numba>=0.60", "opencv-python-headless>=4.9,<5", "scipy>=1.11", "nltk>=3.9", "toolz>=1.0"]
hub = ["fastapi>=0.110", "uvicorn>=0.30", "httpx>=0.27"]
worker = ["nle==1.3.0"]

[dependency-groups]
dev = [
    "fastapi>=0.110",
    "mypy>=1.11",
    "numpy>=2.4.6",
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
]

[project.scripts]
nethackers = "nethackers.cli:main"
nethackers-hub = "nethackers.hub.server:main"
nethackers-worker = "nethackers.worker.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nethackers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "nle: requires the optional NLE dependency and a real NetHack environment",
  "docker: requires Docker and the built arena image",
  "codex_live: requires the real codex CLI + login (model-discovery regression)",
  "claude_live: requires the real claude CLI + network (live hermeticity regression)",
  "github_live: requires the real GitHub App + network",
]

[tool.mypy]
python_version = "3.11"
packages = ["nethackers"]
warn_unused_ignores = true
# Fixture bots are dynamically loaded one-at-a-time via sys.path + importlib
# (nethackers.arena.sandbox._load_agent), exactly like a real submission's
# bot.py -- they are never simultaneously importable as static modules.
# Without this exclude, mypy's directory walk sees three unrelated
# tests/fixtures/bots/*/bot.py files (no __init__.py, by design -- they
# mirror a real submission root) and fails collection with "Duplicate
# module named 'bot'" before any type checking runs.
exclude = ["^tests/fixtures/"]

[[tool.mypy.overrides]]
module = [
    "nle.*",
    "numba.*",
    "cv2.*",
    "scipy.*",
    "nltk.*",
    "toolz.*",
    "autoascend.*",
    "arena_adapter.*",
    "bot",
    "uvicorn",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["roots/autoascend/autoascend"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.ruff.lint.isort]
# Without this, isort splits every `from X import a as b` onto its own
# single-symbol `from X import (...)` block instead of grouping same-module
# aliased imports together -- cli.py's `plain_*`/`rich_*` renderer aliases
# (CLI-UX pass) need the grouped form to stay readable.
combine-as-imports = true
