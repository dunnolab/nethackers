name: Sandbox images

# Manual bootstrap / re-pin workflow (design doc
# docs/superpowers/specs/2026-08-28-sandbox-image-distribution-design.md,
# sections 5.3/5.4/8, decision D11). Builds+pushes `nle-base` once, multi-arch
# (an unpinned GHCR intermediate -- a registry ref, so buildx's isolated
# docker-container driver can resolve it as a FROM base on both arches; never
# referenced outside this workflow, never pulled by users), then builds and
# pushes BOTH `arena` and `mutator` multi-arch FROM that exact nle-base ref --
# section 5.3's "pull both, fetch the base once" precondition -- to GHCR,
# public, each under a permanent `sha-<gitsha>` tag (GHCR's GC deletes
# untagged digests, so the tag keeps a pinned digest alive). This does NOT
# run on release/tag push: publishing an image is a deliberate, occasional
# act. After building+pushing, it runs scripts/repin_images.py with the fresh
# digests and OPENS A PR that re-pins src/nethackers/_image_pins.py -- the
# re-pin ceremony (section 8 / D11) as a generated, reviewable PR, not a
# hand-paste. Merge that PR before the next release. Until the first run, the
# placeholder digests already in _image_pins.py 404 for any non-repo install
# by design.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    name: build + push arena/mutator (GHCR, multi-arch)
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the re-pin branch
      packages: write       # push arena/mutator to GHCR
      pull-requests: write  # open the re-pin PR
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683            # v4.2.2

      # arm64 emulation on the (amd64) runner -- the other half of "multi-arch".
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf    # v3.2.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567         # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published to GHCR as an intermediate build base (not just built
      # locally): the multi-arch arena/mutator builds below run under
      # buildx's `docker-container` driver, which builds in an isolated
      # store and cannot resolve a host-local `docker build` tag as a FROM
      # base for the arm64 leg -- it would fall through to a nonexistent
      # `docker.io/nethackers/nle-base:ci` pull and fail on BOTH arches. A
      # registry ref resolves for either arch, so nle-base is pushed here,
      # multi-arch, purely so the two legs below share the exact same
      # compiled-NLE layer (section 5.3: "CI builds nle-base once and both
      # images build FROM that exact digest"). It is never pinned in
      # _image_pins.py and never pulled directly by users -- this tag exists
      # only for this workflow's own FROM references.
      - id: meta-nle-base
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81      # v5.5.1
        with:
          images: ghcr.io/dunnolab/nethackers-nle-base
          flavor: latest=false
          tags: type=sha

      - id: build-nle-base
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75    # v6.9.0
        with:
          context: .
          file: nle-base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-nle-base.outputs.tags }}
          labels: ${{ steps.meta-nle-base.outputs.labels }}

      - id: meta-arena
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81      # v5.5.1
        with:
          images: ghcr.io/dunnolab/nethackers-arena
          flavor: latest=false
          tags: type=sha

      - id: build-arena
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75    # v6.9.0
        with:
          context: .
          file: arena/Dockerfile
          build-args: NLE_BASE=${{ steps.meta-nle-base.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-arena.outputs.tags }}
          labels: ${{ steps.meta-arena.outputs.labels }}

      - id: meta-mutator
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81      # v5.5.1
        with:
          images: ghcr.io/dunnolab/nethackers-mutator
          flavor: latest=false
          tags: type=sha

      - id: build-mutator
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75    # v6.9.0
        with:
          context: .
          file: Dockerfile.mutator
          build-args: NLE_BASE=${{ steps.meta-nle-base.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-mutator.outputs.tags }}
          labels: ${{ steps.meta-mutator.outputs.labels }}

      # Manifest-list digests (D4 glossary) -- the correct thing to pin: a
      # client pulling `...@<this digest>` gets Docker/OCI to auto-select the
      # right platform image. Surfaced in the job summary for visibility, and
      # (next step) fed to scripts/repin_images.py, which regenerates
      # _image_pins.py and opens a PR -- the D11 ceremony as a generated,
      # reviewed PR rather than a hand-paste.
      - name: Write digests to the job summary
        run: |
          {
            echo "### Sandbox image digests"
            echo
            echo '```python'
            echo "ARENA_IMAGE   = \"ghcr.io/dunnolab/nethackers-arena@${{ steps.build-arena.outputs.digest }}\""
            echo "MUTATOR_IMAGE = \"ghcr.io/dunnolab/nethackers-mutator@${{ steps.build-mutator.outputs.digest }}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Regenerate _image_pins.py from the freshly-pushed digests and open a PR
      # (the re-pin ceremony, D11). A no-op if the digests didn't change (e.g. a
      # re-run of an unchanged image). Note: a PR opened with GITHUB_TOKEN does
      # not itself trigger `on: pull_request` CI -- that's fine here, the change
      # is two generated lines and publish-pypi.yml independently gates on these
      # exact digests existing in GHCR before it publishes.
      - name: Re-pin _image_pins.py and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARENA_REF: ghcr.io/dunnolab/nethackers-arena@${{ steps.build-arena.outputs.digest }}
          MUTATOR_REF: ghcr.io/dunnolab/nethackers-mutator@${{ steps.build-mutator.outputs.digest }}
        run: |
          python3 scripts/repin_images.py --arena "$ARENA_REF" --mutator "$MUTATOR_REF"
          if git diff --quiet -- src/nethackers/_image_pins.py; then
            echo "digests unchanged -- nothing to re-pin"
            exit 0
          fi
          short="${GITHUB_SHA::12}"
          branch="repin/sandbox-images-${short}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/nethackers/_image_pins.py
          git commit -m "chore(images): re-pin sandbox digests (built from ${short})"
          git push -u origin "$branch"
          body=$(printf 'Auto-generated by `sandbox-images.yml` from the multi-arch arena+mutator images it just built and pushed to GHCR (source `%s`).\n\nMerge before the next release -- `publish-pypi.yml` gates on these exact digests existing in GHCR.\n\n- arena:   `%s`\n- mutator: `%s`\n' "$GITHUB_SHA" "$ARENA_REF" "$MUTATOR_REF")
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "re-pin sandbox images (${short})" --body "$body"
