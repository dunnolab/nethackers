name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: test + typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3

      - name: Run fast test suite
        run: uv run pytest -m "not nle and not docker and not claude_live and not codex_live and not github_live" -q

      - name: Typecheck (mypy)
        run: uv run mypy src/nethackers tests

      - name: Lint (ruff)
        run: uv run ruff check .
