name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: test + typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3

      - name: Run fast test suite
        run: uv run pytest -m "not nle and not docker and not claude_live and not codex_live and not github_live" -q

      - name: Typecheck (mypy)
        run: uv run mypy src/nethackers tests

      - name: Lint (ruff)
        run: uv run ruff check .

  docker-smoke:
    name: docker compose smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3

      # File-scoped, not `-m docker`: that marker also selects
      # tests/test_mutator_image.py and tests/test_eval_parallel_smoke.py,
      # which need the *built* arena/mutator sandbox images (not just a
      # Docker daemon) and would fail on this bare runner. This job only
      # runs test_compose_smoke.py, which self-manages its own compose
      # lifecycle (project nethackers-smoke, port 8811, `down -v` in
      # `finally`) via the hub's own Dockerfile/compose.yaml -- no
      # `services:` block or pre-built images needed. A full sandbox-image
      # CI job with a build step is a noted follow-up, out of scope here.
      - name: Run docker compose smoke test
        run: uv run pytest tests/test_compose_smoke.py -q

  image-pins-tripwire:
    name: image-pins staleness tripwire
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags -- needed for git describe)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fail if image inputs changed without a re-pin
        run: |
          # design doc docs/superpowers/specs/2026-08-28-sandbox-image-distribution-design.md
          # section 5.12 / D12: these paths feed the arena/mutator image
          # contents (see src/nethackers/_image_pins.py's own docstring and
          # the sandbox-images.yml bootstrap). Diffed against the last
          # RELEASED tag (not just this PR's base branch), per D12/section
          # 5.12, so drift accumulated across merged-but-unreleased PRs -- or
          # a direct push to main -- is still caught, not only drift
          # introduced by this one PR. `--match 'v*'` restricts to actual
          # release tags (hub-image.yml/publish-pypi.yml's own convention),
          # in case any non-release tag ever exists in this repo.
          base="$(git describe --tags --abbrev=0 --match 'v*')"
          echo "diffing against last released tag: $base"
          changed=$(git diff --name-only "${base}...HEAD")
          image_inputs='^(Dockerfile\.mutator|nle-base/Dockerfile|arena/Dockerfile|uv\.lock)$|^(src/nethackers/arena/|src/nethackers/contracts/)'

          if echo "$changed" | grep -qE "$image_inputs" && ! echo "$changed" | grep -qx 'src/nethackers/_image_pins\.py'; then
            echo "::error::image-input paths changed (since $base) without re-pinning src/nethackers/_image_pins.py"
            echo "$changed" | grep -E "$image_inputs"
            echo "fix: run .github/workflows/sandbox-images.yml, then paste the new digests into src/nethackers/_image_pins.py (spec section 8)"
            exit 1
          fi

          echo "ok -- no image-input drift since $base, or the pins were updated alongside it"
