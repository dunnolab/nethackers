name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: test + typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3

      # MUST stay above every `uv run` below: `uv run` silently refreshes
      # uv.lock, so the same check placed after one always passes and the drift
      # stays invisible. That is exactly how the lock came to describe the
      # project as 0.17.0 while pyproject said 0.31.0 -- fourteen releases, and
      # every contributor seeing an unexplained uv.lock in `git status`.
      #
      # Not cosmetic: uv.lock is an arena build input (image-pins-tripwire
      # below, and nle-base/Dockerfile COPYs it), so an accidental refresh
      # obliges the whole re-pin ceremony -- rebuild the sandbox images,
      # classify the new arena digest, re-pin. Catching it here is the cheap end.
      - name: Lockfile in sync with pyproject (uv lock --check)
        run: uv lock --check

      - name: Run fast test suite
        run: uv run pytest -m "not nle and not docker and not claude_live and not codex_live and not github_live" -q

      - name: Typecheck (mypy)
        run: uv run mypy src/nethackers tests

      - name: Lint (ruff)
        run: uv run ruff check .

  docker-smoke:
    name: docker compose smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3

      # File-scoped, not `-m docker`: that marker also selects
      # tests/test_mutator_image.py and tests/test_eval_parallel_smoke.py,
      # which need the *built* arena/mutator sandbox images (not just a
      # Docker daemon) and would fail on this bare runner. This job only
      # runs test_compose_smoke.py, which self-manages its own compose
      # lifecycle (project nethackers-smoke, port 8811, `down -v` in
      # `finally`) via the hub's own Dockerfile/compose.yaml -- no
      # `services:` block or pre-built images needed. A full sandbox-image
      # CI job with a build step is a noted follow-up, out of scope here.
      - name: Run docker compose smoke test
        run: uv run pytest tests/test_compose_smoke.py -q

  image-pins-tripwire:
    name: image-pins staleness tripwire
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags -- needed for git describe)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fail if arena inputs changed without an arena re-pin
        run: |
          # Per image (spec 2026-09-15 D10). The mutator is re-pinned automatically
          # by mutator-image.yml and checked exactly at release (publish-pypi.yml),
          # so this guards only the arena: if its inputs changed since the last
          # RELEASED tag, ARENA_IMAGE must have changed too. Diffed against the last
          # `v*` tag, not the PR base, so drift across merged-but-unreleased PRs is
          # still caught (spec 2026-08-28 D12).
          base="$(git describe --tags --abbrev=0 --match 'v*')"
          echo "diffing against last released tag: $base"
          changed=$(git diff --name-only "${base}...HEAD")
          arena_inputs='^(nle-base/Dockerfile|arena/Dockerfile|uv\.lock)$|^(src/nethackers/arena/|src/nethackers/contracts/)'

          if ! echo "$changed" | grep -qE "$arena_inputs"; then
            echo "ok -- no arena-input changes since $base"
            exit 0
          fi

          arena_then=$(git show "${base}:src/nethackers/_image_pins.py" | python3 -c 'import sys; ns = {}; exec(sys.stdin.read(), ns); print(ns["ARENA_IMAGE"])')
          arena_now=$(PYTHONPATH=src python3 -c 'from nethackers._image_pins import ARENA_IMAGE; print(ARENA_IMAGE)')
          if [ "$arena_then" = "$arena_now" ]; then
            echo "::error::arena inputs changed since $base without re-pinning ARENA_IMAGE"
            echo "$changed" | grep -E "$arena_inputs"
            echo "fix: run .github/workflows/sandbox-images.yml on this branch, then classify the new arena digest in src/nethackers/arena_version.py"
            exit 1
          fi
          echo "ok -- arena inputs changed and ARENA_IMAGE was re-pinned"
