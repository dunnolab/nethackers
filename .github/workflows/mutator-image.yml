name: Mutator image

# Automatic mutator rebuild + re-pin (spec
# docs/superpowers/specs/2026-09-15-mutator-image-automation-design.md §5.3).
# Builds the mutator for its input fingerprint only when GHCR lacks it, on the
# pinned nle-base, and commits the re-pin to the branch with a GitHub App token
# so the commit starts the PR's checks (GITHUB_TOKEN pushes start none). The
# bot's own commit re-triggers this workflow, which then finds the image and the
# pins current and exits: that is the loop guard. Fork PRs build amd64 without
# publishing; the run on main after merge publishes. The arena and the base are
# NOT built here -- they stay the manual sandbox-images.yml.
on:
  pull_request:
    paths:
      - Dockerfile.mutator
      - docker-entrypoint.sh
      - src/nethackers/__init__.py
      - src/nethackers/arena/**
      - src/nethackers/contracts/**
      - src/nethackers/_image_pins.py
      - src/nethackers/image_inputs.py
      - .github/workflows/mutator-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.mutator
      - docker-entrypoint.sh
      - src/nethackers/__init__.py
      - src/nethackers/arena/**
      - src/nethackers/contracts/**
      - src/nethackers/_image_pins.py
      - src/nethackers/image_inputs.py
      - .github/workflows/mutator-image.yml
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (or per ref outside PRs) at a time. Keyed on the PR number, not
# the head branch's name: a fork's `main` must not share this repo's main group,
# where a newer queued run cancels a pending one. Not cancel-in-progress: the
# bot's re-pin push starts a new run while the building run is still finishing,
# and cancelling it would mark a successful build "cancelled". Queued runs
# collapse to the newest.
concurrency:
  group: mutator-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  mutator:
    name: build + re-pin the mutator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REPO: ghcr.io/dunnolab/nethackers-mutator
      SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: App token (same-repo runs only; forks get no secrets)
        id: app
        if: env.SAME_REPO == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.IMAGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IMAGE_BOT_PRIVATE_KEY }}
          permission-contents: write

      # The PR's head, not the merge commit: that is what gets re-pinned and pushed.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Fingerprint the mutator
        id: fp
        run: |
          inputs=$(PYTHONPATH=src python3 -m nethackers.image_inputs mutator)
          base=$(PYTHONPATH=src python3 -c 'from nethackers._image_pins import NLE_BASE_IMAGE; print(NLE_BASE_IMAGE)')
          {
            echo "inputs=$inputs"
            echo "base=$base"
            echo "tag=h-${inputs#sha256:}"
          } >> "$GITHUB_OUTPUT"
          echo "mutator inputs: $inputs"

      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf    # v3.2.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567         # v3.3.0
        if: env.SAME_REPO == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this fingerprint already published?
        id: exists
        run: |
          if docker buildx imagetools inspect "$REPO:${{ steps.fp.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "already in GHCR -- nothing to build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and, for same-repo runs, push) the mutator
        id: build
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75    # v6.9.0
        with:
          context: .
          file: Dockerfile.mutator
          build-args: NLE_BASE=${{ steps.fp.outputs.base }}
          platforms: ${{ env.SAME_REPO == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.SAME_REPO == 'true' }}
          tags: |
            ${{ env.REPO }}:${{ steps.fp.outputs.tag }}
            ${{ env.REPO }}:sha-${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fork PR -- nothing published
        if: env.SAME_REPO != 'true'
        run: echo "Built linux/amd64 only. The image is published and pinned after merge, by this workflow's run on main." >> "$GITHUB_STEP_SUMMARY"

      - name: Re-pin the mutator (commit to this branch)
        if: env.SAME_REPO == 'true'
        env:
          BUILT_FROM: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ steps.exists.outputs.exists }}" = "true" ]; then
            digest=$(docker buildx imagetools inspect "$REPO:${{ steps.fp.outputs.tag }}" --format '{{.Manifest.Digest}}')
          else
            digest="${{ steps.build.outputs.digest }}"
          fi
          python3 scripts/repin_images.py --mutator "$REPO@$digest" --mutator-inputs "${{ steps.fp.outputs.inputs }}"
          if git diff --quiet -- src/nethackers/_image_pins.py; then
            echo "pins already current -- nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nethackers/_image_pins.py
          tag="${{ steps.fp.outputs.tag }}"
          git commit -m "chore(images): re-pin mutator (${tag:0:14})"
          # Push only while the branch still points at the commit this run built.
          if git push --force-with-lease="refs/heads/$BRANCH:$BUILT_FROM" origin "HEAD:refs/heads/$BRANCH"; then
            exit 0
          fi
          # A newer push (or a merge that deleted the branch) wins: its own run
          # re-pins. Any other failure -- a revoked App, a protected branch -- is an
          # error, or the pins would silently stay stale.
          remote=$(git ls-remote origin "refs/heads/$BRANCH") || { echo "::error::could not reach origin to check $BRANCH"; exit 1; }
          if [ "$(printf '%s' "$remote" | cut -f1)" != "$BUILT_FROM" ]; then
            echo "::notice::$BRANCH moved during the build; the newer push re-runs this workflow"
            exit 0
          fi
          echo "::error::could not push the mutator re-pin to $BRANCH"
          exit 1
