name: Publish Python CLI

# Publishes the `nethackers` CLI to PyPI via OIDC trusted publishing. The trust
# is bound to owner/repo `dunnolab/nethackers`, this workflow filename, and the
# `pypi` environment -- keep all three stable. Testing/linting live in ci.yml;
# this workflow only builds, checks, and publishes a tagged release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to publish (e.g. v0.8.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    environment:
      name: pypi
      url: https://pypi.org/p/nethackers
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Match the release tag to the package version
        run: test "$RELEASE_REF" = "v$(uv version --short)"
      - name: Build and inspect distributions
        run: |
          uv build --no-sources
          uvx twine check dist/*
      - name: Gate on the mutator pin matching its files
        run: |
          # Spec 2026-09-15 §5.4: a release must never ship a mutator pin built from
          # different files than the ones it tags.
          pinned=$(uv run python -c 'from nethackers._image_pins import MUTATOR_INPUTS; print(MUTATOR_INPUTS)')
          actual=$(uv run python -m nethackers.image_inputs mutator --root .)
          if [ "$pinned" != "$actual" ]; then
            echo "::error::MUTATOR_INPUTS is $pinned but this tree's mutator files hash to $actual"
            echo "let .github/workflows/mutator-image.yml re-pin the mutator, move the tag onto that commit, and re-run this release"
            exit 1
          fi
          echo "mutator pin matches its files: $actual"
      - name: Gate on published sandbox images
        env:
          # `docker manifest` is still marked experimental in the Docker CLI.
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          # D12 (docs/superpowers/specs/2026-08-28-sandbox-image-distribution-design.md
          # section 5.12): a wheel must never reach PyPI pinning sandbox image
          # digests that don't actually exist in GHCR -- that's the exact
          # "changed the image, forgot to re-pin" failure this distribution
          # design exists to prevent. Read the two pins from the single
          # source of truth (_image_pins.py, section 5.4) rather than
          # re-parsing/duplicating its format, then poll `docker manifest
          # inspect` (anonymous -- both repos are public, D3) with retries: a
          # just-pushed manifest can take a short while to propagate for
          # anonymous reads.
          refs=$(uv run python -c 'from nethackers._image_pins import ARENA_IMAGE, MUTATOR_IMAGE; print(ARENA_IMAGE); print(MUTATOR_IMAGE)')

          deadline=$((SECONDS + 1200))  # ~20 minutes
          for ref in $refs; do
            echo "waiting for $ref ..."
            until docker manifest inspect "$ref" >/dev/null 2>&1; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::sandbox image not found in GHCR after 20m: $ref"
                echo "run .github/workflows/sandbox-images.yml, commit the real digest into src/nethackers/_image_pins.py (spec section 8), then re-run this release"
                exit 1
              fi
              sleep 15
            done
            echo "found $ref"
          done
      - name: Publish with PyPI OIDC
        run: uv publish --trusted-publishing always
      - name: Canary -- verify the published version installs and runs
        run: |
          # `uv publish` succeeding only proves the upload was accepted --
          # it says nothing about whether PyPI's index has propagated yet
          # or whether the artifact it now serves actually runs. Reuses
          # the same version this job already validated matches
          # RELEASE_REF (the "Match the release tag to the package
          # version" step above; the checkout is pinned to RELEASE_REF, so
          # `uv version --short` is deterministically the same value
          # here). `--isolated --no-cache` forces a real fetch against
          # PyPI on every attempt, not a locally cached hit/miss. Retries
          # with a bounded budget since index propagation can lag a few
          # seconds to a couple of minutes. Failure is LOUD (::error::,
          # full transcript) and clearly labeled "canary" so it is never
          # confused with the publish step itself failing -- by this
          # point the package IS on PyPI either way.
          V="$(uv version --short)"
          echo "canary: waiting for PyPI to serve nethackers==$V and confirming it runs ..."
          sleep 10
          deadline=$((SECONDS + 300))  # 5 minutes
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            # `set -e` is on (the default `bash -e` shell), and a failing
            # command substitution in an assignment trips it -- so a bare
            # `FULL=$(uvx ...)` aborted the whole step on the FIRST attempt and
            # `rc=$?` was never reached. The retry budget below was therefore
            # dead code: any propagation lag past the initial sleep failed the
            # release. `|| rc=$?` keeps the non-zero status from firing `-e`.
            rc=0
            FULL=$(uvx --isolated --no-cache "nethackers@$V" --version 2>&1) || rc=$?
            # uvx prints install progress ("Downloading …") before the CLI's own
            # output, so match the version LINE anywhere in $FULL -- not head -1,
            # which catches the progress line and never confirms.
            if [ "$rc" -eq 0 ] && printf '%s\n' "$FULL" | grep -qF "nethackers $V"; then
              echo "canary: attempt $attempt: confirmed nethackers $V"
              echo "canary: ok -- PyPI serves nethackers $V and it reports the tagged version"
              break
            fi
            echo "canary: attempt $attempt did not confirm the published version yet (rc=$rc)"
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::canary: uvx nethackers@$V --version never confirmed the published version within 5 minutes of publishing -- PyPI index propagation stalled, or the published artifact is broken"
              echo "canary: last full output was:"
              echo "$FULL"
              exit 1
            fi
            sleep 15
          done
